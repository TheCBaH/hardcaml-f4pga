name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml_version: ['4.14.3', '5.4.1']
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    uses: ./.github/workflows/ci.yml
    with:
      os: ${{ matrix.os }}
      ocaml_version: ${{ matrix.ocaml_version }}
      platform: ${{ matrix.platform }}
    secrets: inherit
