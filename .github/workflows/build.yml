name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: matrix
      id: matrix
      run: |
        python3 - <<'EOF2'
        import json, os
        matrix = []
        for ver in ["4.14.3", "5.4.1"]:
            matrix.append({"os": "ubuntu-24.04",     "ocaml_version": ver, "platform": "linux/amd64"})
            matrix.append({"os": "ubuntu-24.04-arm", "ocaml_version": ver, "platform": "linux/arm64"})
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write("matrix<<__OUTPUT__\n%s\n__OUTPUT__\n" % json.dumps(matrix))
        EOF2
  images:
    needs: matrix
    uses: ./.github/workflows/images.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}
    secrets: inherit
  build:
    needs: [images, matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: authenticate image cache
      run: |
        echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        cli-version: '0.88.0'
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: runtest
      run: |
        ${{ env.EXEC }} make runtest
    - name: format
      run: |
        ${{ env.EXEC }} make format
    - name: hardcaml
      run: |
        ${{ env.EXEC }} make rtl
    - name: hardcaml utop
      run: |
        ${{ env.EXEC }} sh -ceux "echo '#use \"src/util.ml\";;' | make utop | tee log.utop"
        grep hierarchical log.utop
    - name: openXC7 basys3
      run: |
        ${{ env.EXEC }} make basys3.design
    - name: openXC7 arty_35
      run: |
        ${{ env.EXEC }} make arty_35.design
    - name: incremental FPGA build
      run: |
        ${{ env.EXEC }} make --question build/basys3/top.bit build/arty_35/top.bit
    - name: FPGA build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: fpga-designs-${{ matrix.ocaml_version }}-${{ runner.arch }}
        path: |
          build/*/top.bit
          build/*/pnr.log
          build/*/timing.json
        if-no-files-found: error
