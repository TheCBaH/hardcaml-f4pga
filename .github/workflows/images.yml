name: images
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  devcontainer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        env:
          OCAML_VERSION: ${{ matrix.ocaml_version }}
        with:
          cli-version: '0.88.0'
          variant: ${{ matrix.ocaml_version }}
          platform: ${{ matrix.platform }}
          post-create: 'false'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Check cached build dependencies
        run: ${{ steps.container.outputs.exec }} bash -c 'opam exec -- ocamlc -version; yosys -V; test -s /opt/openxc7/share/chipdb/xc7a50t.delay'
