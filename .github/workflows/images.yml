name: images
on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.devcontainer.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          post-create: 'false'
          username: ${{ github.event_name != 'pull_request' && github.actor || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
      - name: Check cached build dependencies
        run: ${{ steps.container.outputs.exec }} bash -c 'opam exec -- ocamlc -version; yosys -V; test -s /opt/openxc7/share/chipdb/xc7a50t.delay'
      - name: Dependency image reference
        id: image
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:].' '[:lower:]_')
          echo "image=ghcr.io/$repo/devcontainer-amd64:$tag" >> "$GITHUB_OUTPUT"
